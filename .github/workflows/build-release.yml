name: Unzip, Build & Release APK

on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:
    inputs:
      zip_path:
        description: "zip path (blank = first .zip in root)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find & unzip project
        id: unzip
        run: |
          set -euo pipefail

          ZIP="${{ github.event.inputs.zip_path }}"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "::error::No .zip found in repo root."
            exit 1
          fi
          echo "Using zip: $ZIP"

          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
          rm -rf "$RUNNER_TEMP/src/__MACOSX"

          SETTINGS="$(find "$RUNNER_TEMP/src" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) not found inside zip."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: ${{ steps.unzip.outputs.project_dir }}
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find "${{ steps.unzip.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not built."
            exit 1
          fi
          mkdir -p dist
          OUT="dist/AeroNetManager-build-${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroNetManager-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aero Net Manager build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true