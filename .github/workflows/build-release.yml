name: Unzip, Build & Release APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n1)
          echo "Found zip: $ZIP"
          ls -la
          if [ -n "$ZIP" ]; then
            mkdir -p work
            unzip -q -o "$ZIP" -d work
            SRC=$(dirname "$(find work -name settings.gradle.kts | head -n1)")
          elif [ -f settings.gradle.kts ]; then
            SRC=.
          else
            echo "No zip file or project found in repo" && exit 1
          fi
          echo "PROJECT_DIR=$SRC" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Fetch tun2socks (hev-socks5-tunnel)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
          grep -n "LOCAL_MODULE\|BUILD_" app/src/main/jni/hev-socks5-tunnel/Android.mk || true
          grep -rn "TProxyService" app/src/main/jni/hev-socks5-tunnel/src/*.c || true
          cp "$GITHUB_WORKSPACE/${{ env.PROJECT_DIR }}/native-overrides/hev-jni.c" app/src/main/jni/hev-socks5-tunnel/src/hev-jni.c

      - name: Build native lib (ndk-build)
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK=$NDK"
          cd $GITHUB_WORKSPACE/${{ env.PROJECT_DIR }}
          ls app/src/main/jni app/src/main/jni/hev-socks5-tunnel
          cd app/src/main/jni
          set +e
          "$NDK/ndk-build" NDK_PROJECT_PATH=$PWD APP_BUILD_SCRIPT=$PWD/Android.mk NDK_APPLICATION_MK=$PWD/Application.mk NDK_LIBS_OUT=$PWD/../jniLibs NDK_OUT=/tmp/ndkobj -j4 > /tmp/ndk.log 2>&1
          RC=$?
          tail -n 40 /tmp/ndk.log
          if [ $RC -ne 0 ]; then
            echo "::error::ndk-build exit $RC | dir: $(ls . hev-socks5-tunnel | tr '\n' ' ')"
            grep -iE "error|Android NDK|No rule|undefined" /tmp/ndk.log | head -n 6 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            echo "::error::LAST: $(tail -n 3 /tmp/ndk.log | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi
          find ../jniLibs -name "*.so"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Check native libs in APK
        run: unzip -l ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk | grep -E '\.so' || (echo 'NO NATIVE LIB IN APK' && exit 1)

      - name: Rename APK
        run: cp ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk NetThrottle.apk

      - uses: actions/upload-artifact@v4
        with: { name: NetThrottle-apk, path: NetThrottle.apk }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NetThrottle v${{ github.run_number }}
          files: NetThrottle.apk